<title id="title">Norwegian Foot March route sequence</title>
<desc id="desc">Schematic, not to scale. Start and finish at Mance Buchanon Park Playground. Route west to O'side Rock Garden, return east past Mance Buchanon Park to the easternmost turnaround on the San Luis Rey River Trail, then return west to the playground.</desc>
